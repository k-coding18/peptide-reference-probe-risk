[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-peft"
version = "1.0.0"
description = "Reproduction code for pre-adaptation failure-risk stratification of therapeutic-peptide classifiers"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
full = [
  "scikit-learn>=1.4,<1.7",
  "torch==2.11.0",
  "transformers==4.48.1",
  "peft==0.19.1",
  "biopython>=1.83,<1.86",
]

[project.scripts]
pre-peft = "pre_peft.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
